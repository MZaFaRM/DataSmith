name: App Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to create (for example, v1.9.2)
        required: true
        type: string

concurrency:
  group: app-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.release-version.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version and create tag
        id: release-version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const tag = process.env.RELEASE_TAG.trim()
          const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag)
          if (!match) throw new Error('Enter a version tag in vMAJOR.MINOR.PATCH format, such as v1.9.2')
          if (execFileSync('git', ['tag', '--list', tag], { encoding: 'utf8' }).trim()) {
            throw new Error(`Tag ${tag} already exists`)
          }

          const packagePath = 'frontend/package.json'
          const tauriPath = 'src-tauri/tauri.conf.json'
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          const tauriConfig = JSON.parse(fs.readFileSync(tauriPath, 'utf8'))
          const version = match.slice(1).join('.')

          packageJson.version = version
          tauriConfig.version = version
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`)
          fs.writeFileSync(tauriPath, `${JSON.stringify(tauriConfig, null, 2)}\n`)

          const cargoPath = 'src-tauri/Cargo.toml'
          const cargoManifest = fs.readFileSync(cargoPath, 'utf8')
          fs.writeFileSync(cargoPath, cargoManifest.replace(/^version = "[^"]+"/m, `version = "${version}"`))

          const lockPath = 'src-tauri/Cargo.lock'
          const lockfile = fs.readFileSync(lockPath, 'utf8')
          const packageVersionPattern = /(\[\[package\]\]\r?\nname = "DataSmith"\r?\nversion = ")[^"]+(\")/
          if (!packageVersionPattern.test(lockfile)) {
            throw new Error('Could not find DataSmith in Cargo.lock')
          }
          const updatedLockfile = lockfile.replace(packageVersionPattern, `$1${version}$2`)
          fs.writeFileSync(lockPath, updatedLockfile)

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag_name=${tag}\n`)
          NODE

          RELEASE_TAG=$(node -p "'v' + require('./frontend/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${RELEASE_TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          release_tag: ${{ steps.release-version.outputs.tag_name }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.release_tag,
              name: process.env.release_tag,
              generate_release_notes: true,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2 -> v2/target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install apt dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Backend
        run: pip install -r requirements.txt

      - name: Build backend
        run: python build.py

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseDraft: true

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })

  cleanup-failed-release:
    if: ${{ failure() }}
    needs: [create-release, build-tauri, publish-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Delete failed draft release and generated tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.tag_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG
            if (!tag) {
              core.notice('No release tag was created; nothing to clean up.')
              return
            }

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              })

              if (!release.draft) {
                core.notice(`Release ${tag} is already published; keeping it and its tag.`)
                return
              }

              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              })
              core.info(`Deleted draft release ${tag}.`)
            } catch (error) {
              if (error.status !== 404) throw error
              core.info(`No release draft exists for ${tag}.`)
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              })
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              })
              core.info(`Deleted generated tag ${tag}.`)
            } catch (error) {
              if (error.status !== 404) throw error
              core.info(`Tag ${tag} does not exist; nothing to delete.`)
            }
